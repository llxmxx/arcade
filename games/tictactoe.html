<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TICTAC TOE IN THE ARCADEEEEEEEE</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="game-top">
        <a class="back" href="../index.html"><- booth</a>
        <span class="game-name">tic tac toe</span>
    </div>
    <main class="game">
        <div class="scores">
            <div class="score-chip">
                player x
                <span>0</span>
            </div>
            <div class="score-chip">
                player o
                <span>0</span>
            </div>
            <div class="score-chip">
                ties
                <span>0</span>
            </div>
        </div>
        <div class="ttt-board"></div>
        <p>someone's turn</p>
        <div class="btn-row">
            <button class="btn">new round</button>
            <button class="btn">reset scores</button>
        </div>
    </main>
</body>
</html>
